name: fetch-assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.genassets/fetch.json'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Descargar los assets listados en el manifiesto
        run: |
          set -euo pipefail
          test -f .genassets/fetch.json
          python3 - <<'PY'
          import json, os, subprocess
          items = json.load(open('.genassets/fetch.json'))
          for it in items:
              out = os.path.join('.genassets', it['out'])
              os.makedirs(os.path.dirname(out), exist_ok=True)
              subprocess.run(['curl', '-fsSL', '-o', out, it['url']], check=True)
              print(out, os.path.getsize(out))
          PY

      - name: Publicar los assets descargados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .genassets
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "chore: assets descargados por el workflow"
          git push origin HEAD:${{ github.ref_name }}
